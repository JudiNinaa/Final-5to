<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Editar usuario · C.E.N.</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar"><div class="container"><a class="navbar-brand d-flex align-items-center gap-2" href="index.html#/admin"><img src="img/logo-claro.png" alt="Logo"><span>Centro Educativo Nonogasta</span></a></div></nav>
  <main class="container py-4" style="max-width:720px">
    <h1 class="titulo">Editar usuario</h1>
    <div id="msg"></div>
    <form id="f" class="card p-3">
      <div class="row g-2">
        <div class="col-md-6"><label class="form-label">Nombre completo</label><input class="form-control" name="nombre" required></div>
        <div class="col-md-6"><label class="form-label">Usuario</label><input class="form-control" name="usuario" required></div>
        <div class="col-md-6"><label class="form-label">Contraseña (dejar vacía para no cambiarla)</label><input class="form-control" name="clave" ></div>
        <div class="col-md-6"><label class="form-label">Teléfono</label><input class="form-control" name="telefono"></div>
        <div class="col-md-6"><label class="form-label">Rol</label><select class="form-select" name="rol"><option value="alumno">Alumno</option><option value="profesor">Profesor</option><option value="preceptor">Preceptor/a</option><option value="directivo">Directivo</option><option value="creador">Creador</option></select></div>
        <div class="col-md-6" id="bloque-alumno"><label class="form-label">Curso del alumno</label><select class="form-select" name="division_id"></select></div>
        <div class="col-md-6" id="bloque-extra"><label class="form-label">Clave de habilitación (profesores)</label><input class="form-control" name="clave_extra"></div>
        <div class="col-12" id="bloque-cursos"><label class="form-label d-block">Cursos a cargo</label><div id="cursos"></div></div>
      </div>
      <div class="mt-3"><button class="btn btn-cen">Guardar</button> <a class="btn btn-outline-secondary" href="index.html#/admin">Cancelar</a></div>
    </form>
  </main>
  <script type="module" src="js/usuario-form.js"></script>
</body>
</html>
